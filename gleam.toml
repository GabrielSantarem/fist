name = "fist"
version = "1.6.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
description = "a pure, declarative router for Gleam"
licences = ["Apache-2.0"]
repository = { type = "codeberg", user = "MrTomate", repo = "fist" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.\n
[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
mist = ">= 6.0.0 and < 7.0.0"

[documentation]
pages = [
  { title = "User Guide", path = "guide.html", source = "docs/guide.md" },
  { title = "Core Concepts", path = "behavior.html", source = "docs/behavior.md" },
  { title = "Advanced Patterns", path = "advanced.html", source = "docs/advanced.md" },
  { title = "Roadmap", path = "roadmap.html", source = "docs/roadmap.md" },
  { title = "Changelog", path = "changelog.html", source = "docs/changelog.md" }
]
